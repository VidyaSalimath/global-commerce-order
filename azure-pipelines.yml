trigger:
- main

variables:

  # ============================================================
  # Docker / ACR
  # ============================================================

  dockerRegistryServiceConnection: '8609de09-7cc4-4036-9aaa-6e94848e8a02'

  imageRepository: 'global-commerce-order'

  containerRegistry: 'globalcommerceacr2026.azurecr.io'

  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

  # Dynamic immutable image tag
  tag: '$(Build.BuildId)'


  # ============================================================
  # AKS
  # ============================================================

  azureResourceGroup: 'globalcommerce-dev-rg'

  kubernetesCluster: 'globalcommerceaks2026'

  kubernetesNamespace: 'global-commerce'


  # ============================================================
  # Agent
  # ============================================================

  vmImageName: 'ubuntu-latest'


stages:

# ============================================================
# BUILD AND PUSH
# ============================================================

- stage: Build

  displayName: Build and Push

  jobs:

  - job: Build

    displayName: Build Order Docker Image

    pool:
      vmImage: $(vmImageName)

    steps:

    - checkout: self

      displayName: Checkout source


    - task: Docker@2

      displayName: Build and Push Order Image to ACR

      inputs:

        command: buildAndPush

        containerRegistry: $(dockerRegistryServiceConnection)

        repository: $(imageRepository)

        dockerfile: $(dockerfilePath)

        tags: |
          $(tag)


# ============================================================
# DEPLOY TO AKS
# ============================================================

- stage: Deploy

  displayName: Deploy to AKS

  dependsOn: Build

  condition: succeeded()

  jobs:

  - deployment: Deploy

    displayName: Deploy Order Service

    pool:
      vmImage: $(vmImageName)

    environment: 'global-commerce-dev'

    strategy:

      runOnce:

        deploy:

          steps:

          # --------------------------------------------------
          # Checkout repository
          # --------------------------------------------------

          - checkout: self

            displayName: Checkout source


          # --------------------------------------------------
          # DEBUG / VERIFY MANIFESTS
          # --------------------------------------------------

          - task: Bash@3

            displayName: Verify repository and manifests

            inputs:

              targetType: inline

              script: |

                set -e

                echo "========================================"
                echo "Order CI/CD Verification"
                echo "========================================"

                echo ""
                echo "Build.SourcesDirectory:"
                echo "$(Build.SourcesDirectory)"

                echo ""
                echo "Image repository:"
                echo "$(imageRepository)"

                echo ""
                echo "Container registry:"
                echo "$(containerRegistry)"

                echo ""
                echo "Build ID / Image tag:"
                echo "$(tag)"

                echo ""
                echo "Expected image:"
                echo "$(containerRegistry)/$(imageRepository):$(tag)"


                echo ""
                echo "========================================"
                echo "Repository files"
                echo "========================================"

                find "$(Build.SourcesDirectory)" -type f | sort


                echo ""
                echo "========================================"
                echo "Manifest directory"
                echo "========================================"

                ls -la "$(Build.SourcesDirectory)/manifests"


                echo ""
                echo "========================================"
                echo "Checking deployment.yml"
                echo "========================================"

                if [ -f "$(Build.SourcesDirectory)/manifests/deployment.yml" ]; then

                  echo "FOUND deployment.yml"

                else

                  echo "ERROR: deployment.yml NOT FOUND"

                  exit 1

                fi


                echo ""
                echo "========================================"
                echo "Checking service.yml"
                echo "========================================"

                if [ -f "$(Build.SourcesDirectory)/manifests/service.yml" ]; then

                  echo "FOUND service.yml"

                else

                  echo "ERROR: service.yml NOT FOUND"

                  exit 1

                fi


                echo ""
                echo "========================================"
                echo "Deployment image before substitution"
                echo "========================================"

                grep -n "image:" \
                  "$(Build.SourcesDirectory)/manifests/deployment.yml"


                echo ""
                echo "========================================"
                echo "Container definition"
                echo "========================================"

                grep -n -A6 "containers:" \
                  "$(Build.SourcesDirectory)/manifests/deployment.yml"


                echo ""
                echo "Both manifest files FOUND."


          # --------------------------------------------------
          # INSTALL KUBELOGIN
          # --------------------------------------------------

          - task: KubeloginInstaller@0

            displayName: Install kubelogin


          # --------------------------------------------------
          # DEPLOY TO AKS
          # --------------------------------------------------

          - task: KubernetesManifest@1

            displayName: Deploy Order to AKS

            inputs:

              action: deploy

              connectionType: azureResourceManager

              # Azure DevOps service connection
              azureSubscriptionConnection: GlobalDevopsConn

              # Resource group containing AKS
              azureResourceGroup: $(azureResourceGroup)

              # AKS cluster
              kubernetesCluster: $(kubernetesCluster)

              # Use normal cluster-user credentials
              useClusterAdmin: false

              # Kubernetes namespace
              namespace: $(kubernetesNamespace)

              # Kubernetes manifests
              manifests: |

                $(Build.SourcesDirectory)/manifests/deployment.yml

                $(Build.SourcesDirectory)/manifests/service.yml

              # Replace image with the exact image
              # generated by this build
              containers: |

                $(containerRegistry)/$(imageRepository):$(tag)