apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-commerce-order
  labels:
    app: global-commerce-order

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: global-commerce-order

  template:
    metadata:
      labels:
        app: global-commerce-order

    spec:
      containers:
        - name: order
          image: globalcommerceacr2026.azurecr.io/global-commerce-order:latest

          ports:
            - containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3